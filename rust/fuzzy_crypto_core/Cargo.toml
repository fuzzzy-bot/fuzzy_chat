[package]
name = "fuzzy_crypto_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
vodozemac = { version = "=0.10.0", default-features = false }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
aead-stream = { version = "=0.6.0", features = ["alloc"] }
argon2 = { version = "=0.6.0", features = ["zeroize"] }
hkdf = "0.13"
sha2 = "0.11"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
subtle = "2.6"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
